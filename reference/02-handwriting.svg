<text x="56" y="818" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" fill="#171A16">Read by motion, not by aim: round vs. angular, and where the corner sits — both survive a fast scrawl.</text>
<text x="56" y="836" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" fill="#8A9184">Same code as the typeset form. Attach string-set + base fret to place it. The 8 stretch shapes take angular-belly / double-flick forms.</text>
